[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-workbench"
version = "0.3.0"
description = "Propose, probe, compose and validate agent harnesses with controlled experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agustin Montoya" }]
dependencies = []

[project.scripts]
harness-workbench = "harness_workbench.cli:main"
harness-experiments = "harness_workbench.experiments.cli:main"

[tool.setuptools.packages.find]
include = ["harness_workbench*"]
