[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-workbench"
version = "0.2.0"
description = "Propose, probe, compose and persist self-improving agent harnesses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agustin Montoya" }]
dependencies = []

[project.scripts]
harness-workbench = "harness_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["harness_workbench*"]
